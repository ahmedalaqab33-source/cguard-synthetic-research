[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"
[project]
name = "clinicalguard-research-prototype"
version = "0.2.0"
description = "Approval-bound synthetic research analysis with independent validation"
requires-python = ">=3.12,<3.13"
dependencies = ["pandas==2.3.3", "pydantic==2.12.5"]
license = "MIT"
authors = [{name = "Ahmed Alaqab"}]
[project.optional-dependencies]
dev = ["pytest==9.1.1"]
[project.scripts]
cguard = "cguard_research.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
cguard_research = ["resources/*.json", "resources/*.csv", "resources/*.md", "resources/skills/*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
[tool.ruff]
target-version = "py312"
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
